<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Для тебя 💗</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:18px;display:grid;place-items:center;overflow:hidden;font-family:Arial,system-ui,sans-serif;color:#392b36;background:linear-gradient(135deg,#ffe1ef,#fff8fc);transition:background .7s,color .7s}
main{width:min(94vw,560px);padding:34px 25px;text-align:center;border:1px solid #fff;border-radius:28px;background:#ffffffdf;box-shadow:0 18px 60px #9c54752b;position:relative;z-index:2}
h1{font-size:clamp(1.8rem,5vw,2.6rem);margin:10px 0}
p{line-height:1.6}
input{width:100%;padding:15px;margin:14px 0;border:2px solid #f4b6d0;border-radius:14px;font:inherit;font-size:1rem;outline:none}
input:focus{border-color:#e75d9b}
button{border:0;border-radius:14px;padding:14px 24px;background:#ed78aa;color:white;font:inherit;font-weight:bold;cursor:pointer}
button:focus-visible{outline:3px solid #8b3b65;outline-offset:3px}
#feedback{min-height:28px;margin-top:12px;font-weight:bold;color:#c44b82}
#progress{color:#9b6c83;margin-bottom:12px}
.hidden{display:none!important}
.sparkle{font-size:1.5rem}
body.dark{background:radial-gradient(circle at center,#241b29,#050508 70%);color:#fff}
body.dark main{background:#100d14;border-color:#453344}
#horror{position:fixed;inset:0;z-index:10;background:#050407;display:grid;place-items:center;padding:12px;color:white;text-align:center}
#horror img{display:block;width:min(94vw,760px);max-height:82vh;object-fit:contain;filter:drop-shadow(0 0 22px #ff174d);animation:pop .2s ease-out}
#horror .scaretext{font-size:clamp(1rem,4vw,2rem);letter-spacing:.16em;color:#ff315d;margin-top:14px}
@keyframes pop{from{transform:scale(.25);opacity:.1}to{transform:scale(1);opacity:1}}
#final h1{color:#e65d99}
</style>
</head>
<body>
<main>
  <section id="quiz">
    <div class="sparkle">🌷 ✨ 💗</div>
    <div id="progress">Вопрос 1 из 3</div>
    <h1 id="question">Какого цвета мои глаза?</h1>
    <p id="hint">Только честно… хотя правильный ответ я знаю 😌</p>
    <form id="answerForm">
      <input id="answer" type="text" placeholder="Твой ответ..." autocomplete="off">
      <button id="answerButton" type="submit">Ответить 💞</button>
    </form>
    <div id="feedback" aria-live="polite"></div>
  </section>
  <section id="final" class="hidden">
    <div class="sparkle">🌸 🧸 💕 🌸</div>
    <h1>Я тебя люблю!</h1>
    <p>Очень-очень. Спасибо, что ты есть у меня 💗</p>
    <p>Ты — моё самое любимое чудо.</p>
    <div class="sparkle">💗💗💗</div>
  </section>
</main>

<script>
(function() {
  const questions = [
    { q: "Какого цвета мои глаза?", hint: "Только честно… хотя правильный ответ я знаю 😌", answers: ["голубые"] },
    { q: "Какой мой любимый соус?", hint: "Вспоминай внимательно 😋", answers: ["соцебели", "сацебели"] },
    { q: "Как меня зовут?", hint: "Самый очевидный вопрос 💗", answers: ["мася"] }
  ];
  let step = 0;
  const form = document.getElementById("answerForm");
  const input = document.getElementById("answer");
  const feedback = document.getElementById("feedback");

  form.addEventListener("submit", function(event) {
    event.preventDefault();
    const normalize = value => value.trim().toLocaleLowerCase("ru").replace(/ё/g, "е");
    const value = normalize(input.value);

    if (!value) {
      feedback.textContent = "Сначала напиши ответ 💗";
      input.focus();
      return;
    }
    if (!questions[step].answers.some(answer => normalize(answer) === value)) {
      feedback.textContent = "Ммм… попробуй ещё раз 💕";
      input.select();
      return;
    }

    step += 1;
    if (step < questions.length) {
      document.getElementById("question").textContent = questions[step].q;
      document.getElementById("hint").textContent = questions[step].hint;
      document.getElementById("progress").textContent = "Вопрос " + (step + 1) + " из 3";
      input.value = "";
      feedback.textContent = "Правильно! 💗";
      input.focus();
      return;
    }

    document.body.classList.add("dark");
    document.getElementById("quiz").classList.add("hidden");
    document.getElementById("horror").classList.remove("hidden");
    window.setTimeout(function() {
      document.getElementById("horror").classList.add("hidden");
      document.getElementById("final").classList.remove("hidden");
      document.body.classList.remove("dark");
    }, 2600);
  });
})();
</script>
